services:
  backend:
    image: carlomuzaqi/ta-backend:latest
    build:
      context: .
      dockerfile: BE/final project/Dockerfile
    container_name: digi_backend
    env_file:
      - "BE/final project/.env"
    environment:
      # Bypass DNS completely by using static IP
      MYSQL_HOST: 172.20.0.5
      MYSQL_PORT: 3306
      DEBUG: "False"
    ports:
      - "8000:8000"
    volumes:
      - "./BE/final project/media:/app/media"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      app_network:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: digi_mysql
    env_file:
      - "BE/final project/.env"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      app_network:
        ipv4_address: 172.20.0.5
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    image: carlomuzaqi/ta-frontend:latest
    build:
      context: FE/finalProject
      dockerfile: Dockerfile
    container_name: digi_frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      app_network:
        ipv4_address: 172.20.0.15
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
